<html lang="fa" dir="rtl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>پنل مدیر — آموزشگاه علمی فردا</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --bg:#0E1019; --card:#171A2B; --card2:#1F2337; --ink:#E8EAF3; --ink2:#9AA0B8; --ink3:#6E7490;
  --line:#282D44; --line2:#1E2235; --accent:#93A0E8; --accentSoft:#1B2143; --brass:#DCA954;
  --ok:#5BC28D; --stop:#E08074;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;direction:rtl;line-height:1.85}
a{color:var(--accent);text-decoration:none}
a:hover{color:#b7c0f2}
.top{background:linear-gradient(180deg,#151830,#10121e);border-bottom:1px solid var(--line);padding:34px 0 26px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.top h1{margin:6px 0 6px;font-size:clamp(22px,4.6vw,30px);font-weight:800}
.lede{color:var(--ink2);font-size:14px;margin:0;max-width:60ch}
.hint-bar{margin-top:14px;display:inline-block;font-size:12px;color:var(--ink3);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
section{margin:26px 0}
.shead{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.shead h2{margin:0;font-size:18px;font-weight:800}
.freq{font-size:11.5px;font-weight:700;color:var(--brass);background:#2a2210;border:1px solid #4a3c18;border-radius:999px;padding:3px 11px;white-space:nowrap}
.srule{flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tile:hover{border-color:var(--accent)}
.tile .t{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:5px}
.tile .d{font-size:13px;color:var(--ink2);line-height:1.75;margin-bottom:10px}
.rows{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.row .t{font-size:15.5px;font-weight:800;margin-bottom:4px}
.row .d{font-size:13px;color:var(--ink2);line-height:1.75;margin-bottom:9px}
.u{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;direction:ltr;unicode-bidi:embed;color:var(--accent);background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:3px 9px;word-break:break-all}
.copy{font:inherit;font-size:12px;font-weight:700;color:var(--accent);background:var(--accentSoft);border:1px solid var(--line);border-radius:7px;padding:4px 12px;cursor:pointer}
.copy[data-done="1"]{color:var(--ok)}
pre{background:#0b0d16;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;margin:12px 0 0}
code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;color:#cfe0ff;white-space:pre;direction:ltr;display:block}
.note{background:#2a2210;border:1px solid #4a3c18;border-radius:12px;padding:12px 16px;font-size:13px;color:#f0e2bf;margin-top:12px}
.gate{max-width:440px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 26px;text-align:center}
.gate .lock{font-size:34px}
.gate h2{margin:8px 0 6px;font-size:20px}
.gate p{color:var(--ink2);font-size:13.5px;margin:0 0 4px}
.gate .field{display:flex;gap:10px;margin-top:18px}
.gate input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:15px;padding:11px 13px;text-align:center}
.gate .btn{background:var(--accent);color:#10131f;border:0;border-radius:10px;font:inherit;font-size:15px;font-weight:800;padding:11px 20px;cursor:pointer}
.gate .btn:disabled{opacity:.5}
.msg{margin-top:12px;font-size:13.5px;min-height:20px}
.msg.bad{color:var(--stop)}.msg.good{color:var(--ok)}
footer{text-align:center;color:var(--ink3);font-size:12px;padding:30px 0 40px}
</style>
</head>

var enc=new TextEncoder(), dec=new TextDecoder();
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function unb64(str){var s=atob(str),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
function keyFrom(pw,salt){return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);});}
function open(pw,v){return keyFrom(pw,unb64(v.salt)).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.ct));}).then(function(p){return JSON.parse(dec.decode(p));});}

var root=document.getElementById('app');
function mast(){
  return '<div class="top"><div class="wrap">'
    +'<div class="eyebrow">پنل عملیات — خصوصی</div>'
    +'<h1>آموزشگاه علمی فردا</h1>'
    +'<p class="lede">هر کاری که در حسابداری آموزشگاه انجام می‌دهید از یکی از این لینک‌ها شروع می‌شود. این صفحه با رمز شما محافظت می‌شود؛ بدون رمز چیزی دیده نمی‌شود.</p>'
    +'<div class="hint-bar">این صفحه را روی گوشی بوکمارک کنید — فقط با رمز شما باز می‌شود</div>'
    +'</div></div>';
}
function sectionHtml(s){
  var h='<section><div class="shead"><h2>'+esc(s.h)+'</h2>'+(s.freq?'<span class="freq">'+esc(s.freq)+'</span>':'')+'<span class="srule"></span></div>';
  if(s.tiles&&s.tiles.length){h+='<div class="tiles">';for(var i=0;i<s.tiles.length;i++){var t=s.tiles[i];h+='<a class="tile" href="'+esc(t.u)+'" target="_blank" rel="noopener"><div class="t">'+esc(t.t)+'</div><div class="d">'+esc(t.d)+'</div><div class="mono">'+esc(t.u.replace(/^https:\/\/[^/]+/,''))+'</div></a>';}h+='</div>';}
  if(s.items&&s.items.length){h+='<div class="rows">';for(var j=0;j<s.items.length;j++){var it=s.items[j];h+='<div class="row"><div class="t">'+esc(it.t)+'</div><div class="d">'+esc(it.d)+'</div><div class="u"><a class="mono" href="'+esc(it.u)+'" target="_blank" rel="noopener">'+esc(it.u)+'</a><button class="copy" data-copy="'+esc(it.u)+'">کپی</button></div></div>';}h+='</div>';}
  if(s.code)h+='<pre><code>'+esc(s.code)+'</code></pre>';
  if(s.note)h+='<div class="note">'+s.note+'</div>';
  return h+'</section>';
}
function renderGate(err){
  root.innerHTML=mast()+'<div class="wrap"><div class="gate"><div class="lock">🔒</div><h2>قفل است</h2>'
    +'<p>لینک‌های مدیریتی با رمز شما رمزگذاری شده‌اند و بدون رمز اصلاً قابل بازیابی نیستند.</p>'
    +(VAULT.hint?'<p>یادآور رمز: <b>'+esc(VAULT.hint)+'</b></p>':'')
    +'<div class="field"><input id="pw" type="password" placeholder="رمز ورود" autocomplete="current-password"><button class="btn" id="go">باز کن</button></div>'
    +'<div class="msg'+(err?' bad':'')+'" id="gmsg">'+(err||'')+'</div></div></div>';
  var pw=document.getElementById('pw'), go=document.getElementById('go'), gmsg=document.getElementById('gmsg');
  function submit(){
    var v=pw.value; if(!v)return;
    gmsg.className='msg'; gmsg.textContent='در حال باز کردن…'; go.disabled=true;
    open(v,VAULT).then(function(data){ renderSections(data); },function(){ go.disabled=false; gmsg.className='msg bad'; gmsg.textContent='رمز درست نیست.'; });
  }
  go.addEventListener('click',submit);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  pw.focus();
}
function renderSections(data){
  var body=''; var all=(data.open||[]).concat(data.secret||[]);
  for(var i=0;i<all.length;i++)body+=sectionHtml(all[i]);
  root.innerHTML=mast()+'<div class="wrap">'+body+'<footer>آموزشگاه علمی فردا — منطقهٔ زمانی تهران، همه مبالغ به تومان · این صفحه قفل است و فقط با رمز شما باز می‌شود</footer></div>';
  var copies=root.querySelectorAll('.copy');
  for(var c=0;c<copies.length;c++){copies[c].addEventListener('click',function(e){
    var b=e.currentTarget, text=b.getAttribute('data-copy');
    function done(){var old=b.textContent;b.textContent='کپی شد';b.setAttribute('data-done','1');setTimeout(function(){b.textContent=old;b.removeAttribute('data-done');},1500);}
    try{navigator.clipboard.writeText(text).then(done,done);}catch(err){try{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(e2){}}
  });}
}
renderGate();
</script>
</body>
