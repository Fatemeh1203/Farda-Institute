<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>پنل مدیر — آموزشگاه علمی فردا</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --bg:#0E1019; --card:#171A2B; --card2:#1F2337; --ink:#E8EAF3; --ink2:#9AA0B8; --ink3:#6E7490;
  --line:#282D44; --line2:#1E2235; --accent:#93A0E8; --accentSoft:#1B2143; --brass:#DCA954;
  --ok:#5BC28D; --stop:#E08074;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;direction:rtl;line-height:1.85}
a{color:var(--accent);text-decoration:none}
a:hover{color:#b7c0f2}
.top{background:linear-gradient(180deg,#151830,#10121e);border-bottom:1px solid var(--line);padding:34px 0 26px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.top h1{margin:6px 0 6px;font-size:clamp(22px,4.6vw,30px);font-weight:800}
.lede{color:var(--ink2);font-size:14px;margin:0;max-width:60ch}
.hint-bar{margin-top:14px;display:inline-block;font-size:12px;color:var(--ink3);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 13px}
section{margin:26px 0}
.shead{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.shead h2{margin:0;font-size:18px;font-weight:800}
.freq{font-size:11.5px;font-weight:700;color:var(--brass);background:#2a2210;border:1px solid #4a3c18;border-radius:999px;padding:3px 11px;white-space:nowrap}
.srule{flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tile:hover{border-color:var(--accent)}
.tile .t{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:5px}
.tile .d{font-size:13px;color:var(--ink2);line-height:1.75;margin-bottom:10px}
.rows{display:flex;flex-direction:column;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.row .t{font-size:15.5px;font-weight:800;margin-bottom:4px}
.row .d{font-size:13px;color:var(--ink2);line-height:1.75;margin-bottom:9px}
.u{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;direction:ltr;unicode-bidi:embed;color:var(--accent);background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:3px 9px;word-break:break-all}
.copy{font:inherit;font-size:12px;font-weight:700;color:var(--accent);background:var(--accentSoft);border:1px solid var(--line);border-radius:7px;padding:4px 12px;cursor:pointer}
.copy[data-done="1"]{color:var(--ok)}
pre{background:#0b0d16;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;margin:12px 0 0}
code{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;color:#cfe0ff;white-space:pre;direction:ltr;display:block}
.note{background:#2a2210;border:1px solid #4a3c18;border-radius:12px;padding:12px 16px;font-size:13px;color:#f0e2bf;margin-top:12px}
.gate{max-width:440px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 26px;text-align:center}
.gate .lock{font-size:34px}
.gate h2{margin:8px 0 6px;font-size:20px}
.gate p{color:var(--ink2);font-size:13.5px;margin:0 0 4px}
.gate .field{display:flex;gap:10px;margin-top:18px}
.gate input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:15px;padding:11px 13px;text-align:center}
.gate .btn{background:var(--accent);color:#10131f;border:0;border-radius:10px;font:inherit;font-size:15px;font-weight:800;padding:11px 20px;cursor:pointer}
.gate .btn:disabled{opacity:.5}
.msg{margin-top:12px;font-size:13.5px;min-height:20px}
.msg.bad{color:var(--stop)}.msg.good{color:var(--ok)}
.rekey{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.rekey h3{margin:0 0 4px;font-size:16px;font-weight:800}
.rekey p.k{color:var(--ink2);font-size:13px;margin:0 0 14px}
.rekey p.k .mono{white-space:nowrap;word-break:normal}
.rekey label{display:block;font-size:12.5px;color:var(--ink2);margin:10px 0 5px}
.rekey input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;direction:ltr;text-align:left}
.rekey .btn{background:var(--accent);color:#10131f;border:0;border-radius:9px;font:inherit;font-size:14px;font-weight:800;padding:10px 18px;margin-top:14px;cursor:pointer}
.rekey .btn:disabled{opacity:.45;cursor:progress}
.meter{margin-top:9px;font-size:12.5px;line-height:1.7}
.mtrack{display:block;height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.mfill{display:block;height:100%;width:0%;border-radius:99px;transition:width .2s,background .2s}
.mverdict{font-weight:800}
.steps{margin:14px 0 0;padding-inline-start:20px;color:var(--ink2);font-size:13px}
.steps li{margin-bottom:6px}
.steps b{color:var(--ink)}
.ghost{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--accentSoft);border:1px solid var(--line);border-radius:9px;padding:9px 16px;margin-top:10px}
footer{text-align:center;color:var(--ink3);font-size:12px;padding:30px 0 40px}
</style>
</head>
<body>
<div id="app"></div>
<script>

var enc=new TextEncoder(), dec=new TextDecoder();
var VAULT=null, SESSION=null;
var CURRENT=null;
var HOST='https://n8n.aifardainstitute.ir';
var OLD_HOSTS=['https://arezoo000.app.n8n.cloud'];
function migrate(data){
  var t=JSON.stringify(data);
  for(var i=0;i<OLD_HOSTS.length;i++) t=t.split(OLD_HOSTS[i]).join(HOST);
  return JSON.parse(t);
}
var REPO_EDIT='https://github.com/Fatemeh1203/Farda-Institute/edit/main/panel/vault.json';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function unb64(str){var s=atob(str),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
function b64(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function keyFrom(pw,salt,use){return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[use]);});}
function openVault(pw,v){return keyFrom(pw,unb64(v.salt),'decrypt').then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.ct));}).then(function(p){return JSON.parse(dec.decode(p));});}
function sealVault(pw,obj){
  var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  return keyFrom(pw,salt,'encrypt').then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,enc.encode(JSON.stringify(obj)));})
    .then(function(ct){return {v:1,salt:b64(salt),iv:b64(iv),ct:b64(ct)};});
}

/* ---- سنجهٔ قدرت رمز ---- */
var WEAK=['password','123456','qwerty','iloveyou','admin','welcome','farda','renasc','ahmad','12345678'];
function strength(pw){
  if(!pw)return{pct:0,color:'var(--line)',verdict:'رمزی وارد نشده',detail:'',ok:false};
  var pool=0;
  if(/[a-z]/.test(pw))pool+=26;
  if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10;
  if(/[^a-zA-Z0-9\u0600-\u06FF]/.test(pw))pool+=33;
  if(/[\u0600-\u06FF]/.test(pw))pool+=60;
  var perChar=Math.log(pool||2)/Math.log(2);
  /* کلمهٔ حدس‌زدنی تقریباً هیچ امتیازی ندارد، ولی بقیهٔ رمز امتیاز خودش را نگه می‌دارد */
  var rest=pw.toLowerCase(), hits=0;
  for(var i=0;i<WEAK.length;i++){
    while(rest.indexOf(WEAK[i])>=0){rest=rest.replace(WEAK[i],'');hits++;}
  }
  var bits=rest.length*perChar+hits*3;
  var secs=Math.pow(2,bits-1)/100000;   /* ~۱۰۰هزار حدس در ثانیه روی یک کارت گرافیک */
  var h;
  if(secs<60)h='کمتر از یک دقیقه';
  else if(secs<3600)h='حدود '+Math.round(secs/60)+' دقیقه';
  else if(secs<86400)h='حدود '+Math.round(secs/3600)+' ساعت';
  else if(secs<2592000)h='حدود '+Math.round(secs/86400)+' روز';
  else if(secs<31536000)h='حدود '+Math.round(secs/2592000)+' ماه';
  else if(secs<31536000*1000)h='حدود '+Math.round(secs/31536000)+' سال';
  else h='عملاً هرگز';
  var v,c,ok=false;
  if(bits<40){v='خیلی ضعیف';c='var(--stop)';}
  else if(bits<55){v='هنوز ضعیف';c='var(--brass)';}
  else if(bits<70){v='قابل قبول';c='var(--ok)';ok=true;}
  else{v='محکم';c='var(--ok)';ok=true;}
  return{pct:Math.max(4,Math.min(100,Math.round(bits/80*100))),color:c,verdict:v,detail:'— شکستنش '+h+' طول می‌کشد',ok:ok};
}

var root=document.getElementById('app');
function mast(){
  return '<div class="top"><div class="wrap">'
    +'<div class="eyebrow">پنل عملیات — خصوصی</div>'
    +'<h1>آموزشگاه علمی فردا</h1>'
    +'<p class="lede">هر کاری که در حسابداری آموزشگاه انجام می‌دهید از یکی از این لینک‌ها شروع می‌شود. این صفحه با رمز شما محافظت می‌شود؛ بدون رمز چیزی دیده نمی‌شود.</p>'
    +'<div class="hint-bar">این صفحه را روی گوشی بوکمارک کنید — فقط با رمز شما باز می‌شود</div>'
    +'</div></div>';
}
function sectionHtml(s){
  var h='<section><div class="shead"><h2>'+esc(s.h)+'</h2>'+(s.freq?'<span class="freq">'+esc(s.freq)+'</span>':'')+'<span class="srule"></span></div>';
  if(s.tiles&&s.tiles.length){h+='<div class="tiles">';for(var i=0;i<s.tiles.length;i++){var t=s.tiles[i];h+='<a class="tile" href="'+esc(t.u)+'" target="_blank" rel="noopener"><div class="t">'+esc(t.t)+'</div><div class="d">'+esc(t.d)+'</div><div class="mono">'+esc(t.u.replace(/^https:\/\/[^/]+/,''))+'</div></a>';}h+='</div>';}
  if(s.items&&s.items.length){h+='<div class="rows">';for(var j=0;j<s.items.length;j++){var it=s.items[j];h+='<div class="row"><div class="t">'+esc(it.t)+'</div><div class="d">'+esc(it.d)+'</div><div class="u"><a class="mono" href="'+esc(it.u)+'" target="_blank" rel="noopener">'+esc(it.u)+'</a><button class="copy" data-copy="'+esc(it.u)+'">کپی</button></div></div>';}h+='</div>';}
  if(s.code)h+='<pre><code>'+esc(s.code)+'</code></pre>';
  if(s.note)h+='<div class="note">'+s.note+'</div>';
  return h+'</section>';
}
function rekeyHtml(){
  return '<section><div class="shead"><h2>عوض کردن رمز</h2><span class="srule"></span></div>'
    +'<div class="rekey">'
    +'<h3>رمز تازه بگذارید</h3>'
    +'<p class="k">همه‌چیز همین‌جا در مرورگر خودتان انجام می‌شود. رمز تازه به هیچ سروری فرستاده نمی‌شود. آخرش یک متن کوتاه می‌گیرید که باید جای محتوای فایل <span class="mono">panel/vault.json</span> در مخزن بگذارید.</p>'
    +'<label for="np1">رمز تازه</label><input id="np1" type="password" autocomplete="new-password">'
    +'<div class="meter"><span class="mtrack"><span class="mfill" id="mfill"></span></span>'
    +'<span class="mverdict" id="mverdict">رمزی وارد نشده</span> <span id="mdetail" style="color:var(--ink2)"></span></div>'
    +'<label for="np2">یک بار دیگر</label><input id="np2" type="password" autocomplete="new-password">'
    +'<button class="btn" id="seal">مهر کن</button>'
    +'<div class="msg" id="rmsg"></div>'
    +'<div id="rout"></div>'
    +'</div></section>';
}
function wireRekey(data){
  var np1=document.getElementById('np1'), np2=document.getElementById('np2');
  var seal=document.getElementById('seal'), rmsg=document.getElementById('rmsg'), rout=document.getElementById('rout');
  function paint(){
    var st=strength(np1.value);
    document.getElementById('mfill').style.width=st.pct+'%';
    document.getElementById('mfill').style.background=st.color;
    var v=document.getElementById('mverdict');
    v.textContent=st.verdict; v.style.color=st.color;
    document.getElementById('mdetail').textContent=st.detail;
  }
  np1.addEventListener('input',paint); paint();
  seal.addEventListener('click',function(){
    var a=np1.value, b=np2.value;
    if(!a){rmsg.className='msg bad';rmsg.textContent='رمز تازه را وارد کنید.';return;}
    if(a!==b){rmsg.className='msg bad';rmsg.textContent='دو رمز یکی نیستند.';return;}
    var st=strength(a);
    if(!st.ok){rmsg.className='msg bad';rmsg.textContent='این رمز ضعیف است ('+st.verdict+' '+st.detail+'). بلندترش کنید.';return;}
    seal.disabled=true; rmsg.className='msg'; rmsg.textContent='در حال مهر کردن…';
    sealVault(a,CURRENT).then(function(v){
      var txt=JSON.stringify(v);
      rmsg.className='msg good'; rmsg.textContent='مهر شد.';
      rout.innerHTML='<pre><code id="blob"></code></pre>'
        +'<button class="copy" id="cpblob">کپی کن</button> '
        +'<a class="ghost" href="'+REPO_EDIT+'" target="_blank" rel="noopener">باز کردن فایل در گیت‌هاب</a>'
        +'<ol class="steps">'
        +'<li>دکمهٔ <b>کپی کن</b> را بزنید.</li>'
        +'<li>روی <b>باز کردن فایل در گیت‌هاب</b> بزنید — ویرایشگر همان فایل باز می‌شود.</li>'
        +'<li>هرچه داخلش هست پاک کنید و متن کپی‌شده را بچسبانید.</li>'
        +'<li>پایین صفحه <b>Commit changes</b> را بزنید.</li>'
        +'<li>چند دقیقه صبر کنید، بعد همین پنل را با رمز تازه باز کنید.</li>'
        +'</ol>';
      document.getElementById('blob').textContent=txt;
      document.getElementById('cpblob').addEventListener('click',function(e){
        var btn=e.currentTarget;
        function done(){btn.textContent='کپی شد';btn.setAttribute('data-done','1');}
        try{navigator.clipboard.writeText(txt).then(done,done);}catch(err){done();}
      });
      seal.disabled=false; np1.value=''; np2.value=''; paint();
    },function(err){
      seal.disabled=false; rmsg.className='msg bad';
      rmsg.textContent='مهر نشد: '+((err&&err.message)||err);
    });
  });
}
function renderGate(err){
  root.innerHTML=mast()+'<div class="wrap"><div class="gate"><div class="lock">🔒</div><h2>قفل است</h2>'
    +'<p>لینک‌های مدیریتی با رمز شما رمزگذاری شده‌اند و بدون رمز اصلاً قابل بازیابی نیستند.</p>'
    +'<div class="field"><input id="pw" type="password" placeholder="رمز ورود" autocomplete="current-password"><button class="btn" id="go">باز کن</button></div>'
    +'<div class="msg'+(err?' bad':'')+'" id="gmsg">'+(err||'')+'</div></div></div>';
  var pw=document.getElementById('pw'), go=document.getElementById('go'), gmsg=document.getElementById('gmsg');
  function submit(){
    var v=pw.value; if(!v)return;
    gmsg.className='msg'; gmsg.textContent='در حال باز کردن…'; go.disabled=true;
    openVault(v,VAULT).then(function(data){ SESSION=v; renderSections(migrate(data)); },function(){ go.disabled=false; gmsg.className='msg bad'; gmsg.textContent='رمز درست نیست.'; });
  }
  go.addEventListener('click',submit);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});
  pw.focus();
}
function wireCopies(scope){
  var copies=scope.querySelectorAll('.copy');
  for(var c=0;c<copies.length;c++){copies[c].addEventListener('click',function(e){
    var b=e.currentTarget, text=b.getAttribute('data-copy');
    if(!text)return;
    function done(){var old=b.textContent;b.textContent='کپی شد';b.setAttribute('data-done','1');setTimeout(function(){b.textContent=old;b.removeAttribute('data-done');},1500);}
    try{navigator.clipboard.writeText(text).then(done,done);}catch(err){try{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(e2){}}
  });}
}
function paintLinks(data){
  var body=''; var all=(data.open||[]).concat(data.secret||[]);
  for(var i=0;i<all.length;i++)body+=sectionHtml(all[i]);
  var box=document.getElementById('links');
  box.innerHTML=body;
  wireCopies(box);
}
function editHtml(){
  return '<section><div class="shead"><h2>ویرایش لینک‌ها</h2><span class="srule"></span></div>'
    +'<div class="rekey">'
    +'<h3>یک تکه از لینک‌ها را با تکهٔ دیگر عوض کنید</h3>'
    +'<p class="k">مثلاً وقتی مسیر یک فرم عوض شد: مسیر قدیمی را در خانهٔ اول و مسیر تازه را در خانهٔ دوم بنویسید. تغییر فقط وقتی ماندگار می‌شود که بعدش در بخش پایین <b>مهر کن</b> را بزنید و فایل را در گیت‌هاب عوض کنید.</p>'
    +'<label for="f1">این را پیدا کن</label><input id="f1" type="text" autocomplete="off" spellcheck="false">'
    +'<label for="f2">با این عوض کن</label><input id="f2" type="text" autocomplete="off" spellcheck="false">'
    +'<button class="btn" id="rep">جایگزین کن</button>'
    +'<div class="msg" id="fmsg"></div>'
    +'</div></section>';
}
function wireEdit(){
  var f1=document.getElementById('f1'), f2=document.getElementById('f2'), fmsg=document.getElementById('fmsg');
  document.getElementById('rep').addEventListener('click',function(){
    var a=f1.value.trim(), b=f2.value.trim();
    if(!a){fmsg.className='msg bad';fmsg.textContent='خانهٔ اول خالی است.';return;}
    var t=JSON.stringify(CURRENT);
    var n=t.split(a).length-1;
    if(!n){fmsg.className='msg bad';fmsg.textContent='«'+a+'» در هیچ لینکی پیدا نشد.';return;}
    CURRENT=JSON.parse(t.split(a).join(b));
    paintLinks(CURRENT);
    fmsg.className='msg good';
    fmsg.textContent=n+' جا عوض شد. برای ماندگاری، پایین صفحه رمز بگذارید و مهر کنید.';
    f1.value='';f2.value='';
  });
}
function renderSections(data){
  CURRENT=data;
  root.innerHTML=mast()+'<div class="wrap"><div id="links"></div>'+editHtml()+rekeyHtml()
    +'<footer>آموزشگاه علمی فردا — منطقهٔ زمانی تهران، همه مبالغ به تومان · این صفحه قفل است و فقط با رمز شما باز می‌شود</footer></div>';
  paintLinks(data);
  wireEdit();
  wireRekey(data);
}
function boot(){
  root.innerHTML=mast()+'<div class="wrap"><div class="gate"><div class="lock">⏳</div><h2>در حال بارگذاری…</h2></div></div>';
  fetch('vault.json?v='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(v){ VAULT=v; renderGate(); },function(e){
    root.innerHTML=mast()+'<div class="wrap"><div class="gate"><div class="lock">⚠️</div>'
      +'<h2>محتوای قفل خوانده نشد</h2>'
      +'<p>فایل <span class="mono">panel/vault.json</span> پیدا نشد یا خراب است.</p>'
      +'<div class="msg bad">'+esc(e.message||e)+'</div></div></div>';
  });
}
boot();
</script>
